name: Sync README changelog banner

on:
  push:
    branches: [master]
    paths:
      - CHANGELOG.md
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README banner from CHANGELOG
        run: python3 scripts/sync_readme_changelog.py

      - name: Commit if README changed
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: sync README changelog banner [skip ci]"
            git push
          else
            echo "README.md already up to date"
          fi
