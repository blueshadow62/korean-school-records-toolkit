name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # PYTHONUTF8은 설정하지 않는다. Windows 기본 로캘 인코딩에서도 테스트가 통과해야
    # 자식 프로세스 출력을 로캘로 해독하던 결함(2.2.0에서 수정)이 재발할 때 잡힌다.
    # core.autocrlf도 러너 기본값 그대로 둔다. .gitattributes가 빠지면 NEIS 표본의 줄바꿈 바이트 검사가 실패해 잡힌다.
    # 배포본에는 기재요령 원문 변환본이 없으므로 원문 대조 테스트는 건너뛰고 요약 대조 테스트가 돈다.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package contract tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: write-school-records tests
        run: python -m unittest discover -s skills/write-school-records/scripts -p "test_*.py"

      - name: korean-character-count tests
        run: node --test skills/korean-character-count/scripts/korean_character_count.test.js

      - name: Package verifier
        run: python scripts/verify_package.py

      # 문서 전용판(editions/<이름>/)이 전체판의 빌드 결과와 같고 디렉터리 파일 규칙에 맞는지 본다.
      # 같은 검사가 verify_package.py와 tests/test_directory_edition.py에도 있다. 여기서는 실패 원인을 바로 보이게 한다.
      - name: Directory edition is current
        run: python scripts/build_directory_edition.py --check
